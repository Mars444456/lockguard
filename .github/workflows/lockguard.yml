name: LockGuard CI & Migration Gatekeeper

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  postgres-locks:
    name: Real lock tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: lockguard
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: lockguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:postgres
        env:
          LOCKGUARD_TEST_DATABASE_URL: postgres://lockguard:test-only-ci@127.0.0.1:5432/lockguard_test
  test-and-audit:
    name: Tests, browser build and migration audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies and run tests
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Verify browser engine matches sources
        run: |
          npm run build:browser
          git diff --exit-code -- docs/index.html docs/design.css docs/pro.css docs/labels.js docs/lockguard-engine.js docs/libpg-query.wasm
      - name: Verify safe migration exits with 0
        run: node bin/lockguard.js check fixtures/10_safe_migration.sql
      - name: Verify dangerous migration exits with exactly 1
        run: |
          status=0
          node bin/lockguard.js check fixtures/09_catastrophic_combined.sql || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected exit 1, got $status (0 = missed risk, 2 = audit error)."
            exit 1
          fi
      - name: Audit SQL migrations changed in this pull request
        if: github.event_name == 'pull_request'
        env:
          LOCKGUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pr-migrations.js
      - name: Upload actual PR migration report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lockguard-pr-report
          path: lockguard-pr-report.md
          if-no-files-found: ignore
