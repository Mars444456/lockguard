name: LockGuard CI & Migration Gatekeeper

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'fixtures/**'
      - '**/*.sql'
      - 'src/**'
      - 'test/**'
      - 'bin/**'
  push:
    branches:
      - main
      - master

jobs:
  test-and-audit:
    name: Run Unit Tests & Migration Gatekeeper
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Automated Test Suite
        run: npm test

      - name: Run LockGuard Gatekeeper on Safe Demo
        run: |
          node bin/lockguard.js check fixtures/10_safe_migration.sql --format=github-pr-comment --output=lockguard-pr-report.md

      - name: Post Sticky PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('lockguard-pr-report.md')) {
              const body = fs.readFileSync('lockguard-pr-report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
