name: LockGuard CI & Migration Gatekeeper

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Tests, browser build and migration audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies and run tests
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Verify browser engine matches sources
        run: |
          npm run build:browser
          git diff --exit-code -- docs/index.html docs/design.css docs/labels.js docs/lockguard-engine.js docs/libpg-query.wasm
      - name: Verify safe migration exits with 0
        run: node bin/lockguard.js check fixtures/10_safe_migration.sql
      - name: Verify dangerous migration exits with exactly 1
        run: |
          status=0
          node bin/lockguard.js check fixtures/09_catastrophic_combined.sql || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected exit 1, got $status (0 = missed risk, 2 = audit error)."
            exit 1
          fi
      - name: Audit SQL migrations changed in this pull request
        if: github.event_name == 'pull_request'
        env:
          LOCKGUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pr-migrations.js
      - name: Upload actual PR migration report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lockguard-pr-report
          path: lockguard-pr-report.md
          if-no-files-found: ignore
