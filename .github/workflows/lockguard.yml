name: LockGuard Migration Gatekeeper

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'fixtures/**'
      - '**/*.sql'
  push:
    branches:
      - main
      - master

jobs:
  lockguard-audit:
    name: Audit PostgreSQL Locks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run LockGuard Gatekeeper
        run: |
          node bin/lockguard.js check fixtures/ --format=github-pr-comment --output=lockguard-pr-report.md
        env:
          LOCKGUARD_API_KEY: ${{ secrets.LOCKGUARD_API_KEY }}

      - name: Post Sticky PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('lockguard-pr-report.md')) {
              const body = fs.readFileSync('lockguard-pr-report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
