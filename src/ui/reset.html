<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>LockGuard · Восстановление доступа</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="account.css"><script src="reset.js" defer></script></head>
<body><main class="account-panel" style="display:block;max-width:600px;margin:6vh auto;padding:24px"><a href="/">← LockGuard</a><button id="reset-language" type="button" class="btn-secondary" style="float:right">English</button><h1 id="reset-title">Восстановить доступ</h1><p id="reset-note">Введите email аккаунта и резервный код либо код из письма. После смены пароля все прежние сеансы и коды завершатся.</p>
<form id="reset-form" class="account-form"><label><span data-label="email">Email аккаунта</span><input id="reset-email" type="email" autocomplete="username" required maxlength="254"></label><label><span data-label="code">Код восстановления</span><input id="reset-code" autocomplete="off" required minlength="64" maxlength="64" spellcheck="false"></label><label><span data-label="password">Новый пароль · от 12 символов</span><input id="reset-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><button id="reset-submit" class="btn-primary" type="submit">Сменить пароль</button></form>
<hr style="margin:24px 0"><p id="reset-mail-note">Если почтовое восстановление настроено администратором, запросите письмо для указанного email.</p><button id="reset-send" class="btn-secondary" type="button">Получить письмо</button><p id="reset-message" role="status" aria-live="polite"></p></main></body></html>
